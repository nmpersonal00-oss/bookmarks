<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Bookmark Manager</title>
  <style>
    :root {
      --bg: #021a1b;
      --bg-2: #062728;
      --panel: #062f30;
      --panel-2: #083536;
      --card: #063536;
      --card-2: #073d3f;
      --border: rgba(120, 196, 180, 0.18);
      --border-strong: rgba(126, 213, 190, 0.32);
      --text: #e9fbf4;
      --muted: #98c0b8;
      --muted-2: #7ba59c;
      --chip: rgba(131, 196, 180, 0.12);
      --chip-text: #bfe7de;
      --accent: #0d6f67;
      --accent-2: #12917e;
      --accent-soft: rgba(19, 145, 126, 0.18);
      --danger: #ff8f9b;
      --shadow: rgba(0, 0, 0, 0.28);
      --radius-xl: 18px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(18,145,126,0.12), transparent 24%),
        radial-gradient(circle at top right, rgba(18,145,126,0.08), transparent 18%),
        #011112;
      overflow: hidden;
    }

    button, input, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }
    .app {
      /* Use all available browser space instead of a centered 1240 × 820 panel. */
      width: 100%;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      margin: 0;
      display: grid;
      grid-template-columns: 0 minmax(0, 1fr);
      transition: grid-template-columns .22s ease;
      background: linear-gradient(180deg, rgba(5,42,43,.98), rgba(4,30,31,.98));
      border: 0;
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
    }

    .app.sidebar-open { grid-template-columns: 255px minmax(0, 1fr); }
    .sidebar {
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity .14s ease, visibility .14s;
      background: linear-gradient(180deg, #032d2e, #022426);
      border-right: 1px solid var(--border);
      padding: 18px 14px 18px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .sidebar-open .sidebar {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transition-delay: .06s;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 6px 18px;
      font-weight: 700;
      font-size: 16px;
      justify-content: space-between;
    }
    .brand-name { display: inline-flex; flex: 1; align-items: center; gap: 9px; min-width: 0; white-space: nowrap; font-size: 14px; }
    .brand-name span { overflow: hidden; text-overflow: ellipsis; }
    .sidebar-close { flex: 0 0 auto; }
    .sidebar-close {
      background: transparent; border: 0; color: var(--muted); border-radius: 7px;
      width: 29px; height: 29px; display: grid; place-items: center;
    }
    .sidebar-close:hover { background: rgba(255,255,255,.08); color: var(--text); }
    .brand-badge {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: #dcfff8;
      flex: 0 0 auto;
    }
    .brand-badge svg, .icon { width: 16px; height: 16px; }

    .nav {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }
    .nav-btn {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      font-weight: 600;
      text-align: left;
    }
    .nav-btn.active, .nav-btn:hover {
      color: var(--text);
      background: rgba(19,145,126,0.18);
      border-color: rgba(19,145,126,0.28);
    }
    .sidebar-section-label {
      color: #d4eee8;
      opacity: .82;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      margin: 12px 10px 12px;
      text-transform: uppercase;
    }
    .tags-list {
      overflow: auto;
      padding-right: 4px;
      flex: 1;
    }
    .sidebar-bottom {
      margin-top: auto;
      display: flex;
      gap: 9px;
      padding: 16px 4px 1px;
      border-top: 1px solid var(--border);
    }
    .sidebar-bottom .ghost-btn { flex: 1; justify-content: center; }
    .sidebar-backdrop { display: none; }
    .tag-row {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      text-align: left;
    }
    .tag-row:hover, .tag-row.active {
      background: rgba(255,255,255,0.04);
      color: var(--text);
    }
    .tag-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .tag-check {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      background: rgba(255,255,255,0.01);
      display: inline-block;
      flex: 0 0 auto;
    }
    .tag-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tag-count {
      min-width: 22px;
      height: 22px;
      border-radius: 999px;
      padding: 0 7px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.06);
      display: inline-grid;
      place-items: center;
      font-size: 12px;
      color: #bfe7de;
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      height: 100%;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 26px;
      border-bottom: 1px solid var(--border);
      background: rgba(2, 35, 36, 0.55);
    }
    .menu-toggle {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 10px;
      color: var(--text);
      background: rgba(9,80,76,.48);
      border: 1px solid rgba(122,207,184,.16);
    }
    .menu-toggle:hover, .menu-toggle[aria-expanded="true"] { background: rgba(12,105,93,.70); }
    .menu-toggle svg { width: 19px; height: 19px; }
    .search-wrap {
      flex: 1 1 320px;
      min-width: 0;
      max-width: 560px;
      position: relative;
    }
    .search-wrap .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-2);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 16px 0 42px;
      background: linear-gradient(180deg, rgba(8,68,67,0.55), rgba(5,52,53,0.7));
      border: 1px solid rgba(102, 181, 166, 0.18);
      border-radius: 10px;
      outline: none;
      color: var(--text);
    }
    .search-input::placeholder { color: var(--muted-2); }
    .search-input:focus {
      border-color: rgba(84, 212, 185, .45);
      box-shadow: 0 0 0 3px rgba(18,145,126,.14);
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .add-btn, .sort-btn, .menu-btn, .tiny-btn {
      border: 1px solid rgba(109, 188, 170, 0.16);
      background: linear-gradient(180deg, rgba(10,93,83,.94), rgba(8,72,65,.95));
      color: #ecfff8;
      height: 42px;
      border-radius: 10px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .sort-btn {
      background: transparent;
      color: #d7f1eb;
      padding: 0 14px;
    }
    .menu-btn, .tiny-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      justify-content: center;
      background: rgba(255,255,255,0.02);
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.1);
      background: linear-gradient(180deg, #f3d9bc, #c58a55);
      color: #19302e;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 13px;
      flex: 0 0 auto;
    }

    .content {
      min-height: 0;
      overflow: auto;
      padding: 26px;
      background: linear-gradient(180deg, rgba(2, 31, 32, 0.46), rgba(3, 24, 25, 0.1));
    }
    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .page-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .count-line {
      display: none;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 12px;
      align-items: start;
    }
    .card {
      background: linear-gradient(180deg, rgba(6,59,60,.94), rgba(5,52,53,.96));
      border: 1px solid rgba(113,196,179,.14);
      border-radius: 12px;
      min-width: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
      display: flex;
      align-items: center;
      padding: 11px 9px 11px 13px;
      gap: 7px;
      position: relative;
      transition: background .15s, border-color .15s;
    }
    .card:hover {
      background: rgba(12,76,75,.96);
      border-color: rgba(113,196,179,.32);
    }
    .card-link {
      display: flex;
      align-items: center;
      flex: 1;
      gap: 12px;
      min-width: 0;
      border-radius: 7px;
      outline-offset: 3px;
    }
    .site-icon-wrap {
      position: relative;
      width: 43px;
      height: 43px;
      flex: 0 0 auto;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(255,255,255,.09);
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.05);
    }
    .site-icon-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      padding: 7px;
      background: #eff8f5;
      opacity: 0;
    }
    .site-icon-wrap img.loaded { opacity: 1; }
    .site-icon-fallback {
      font-weight: 750;
      font-size: 18px;
      color: #e6fff8;
    }
    .site-meta { min-width: 0; }
    .site-title {
      margin: 0 0 5px;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .site-url {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-controls { display: flex; gap: 1px; align-items: center; flex: 0 0 auto; }
    .card-menu-wrap { position: relative; }
    .dots-btn, .pin-btn {
      width: 29px;
      height: 32px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 7px;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .dots-btn:hover, .pin-btn:hover { background: rgba(255,255,255,.08); color: var(--text); }
    .pin-btn.pinned { color: #8de6d1; }
    .pin-btn .icon, .dots-btn .icon { width: 15px; height: 15px; }
    .dropdown {
      position: absolute;
      right: 0;
      top: 40px;
      width: 170px;
      background: #082d2e;
      border: 1px solid rgba(122, 207, 184, 0.16);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      z-index: 20;
    }
    .dropdown[hidden] { display: none; }
    .dropdown button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      padding: 10px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }
    .dropdown button:hover { background: rgba(255,255,255,0.06); }
    .dropdown .danger { color: var(--danger); }

    .empty {
      border: 1px dashed rgba(122, 207, 184, 0.22);
      border-radius: 14px;
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
    }
    .empty h3 {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 20px;
    }
    .empty p {
      margin: 0 auto 18px;
      max-width: 420px;
      line-height: 1.6;
    }

    dialog {
      border: 1px solid rgba(122, 207, 184, 0.16);
      background: #07292a;
      color: var(--text);
      border-radius: 18px;
      width: min(520px, calc(100vw - 32px));
      padding: 0;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    dialog::backdrop {
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(2px);
    }
    .modal {
      padding: 22px;
    }
    .modal-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    .modal-title {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: -.02em;
    }
    .modal-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .close-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      display: grid;
      place-items: center;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
      color: #daf3ed;
      font-weight: 600;
    }
    .field input, .field textarea {
      width: 100%;
      border: 1px solid rgba(122, 207, 184, 0.14);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
    }
    .field textarea {
      resize: vertical;
      min-height: 100px;
    }
    .field input:focus, .field textarea:focus {
      border-color: rgba(84, 212, 185, .45);
      box-shadow: 0 0 0 3px rgba(18,145,126,.14);
    }
    .error {
      color: var(--danger);
      font-size: 12px;
      min-height: 16px;
      margin-top: 5px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }
    .secondary-btn {
      border: 1px solid rgba(122, 207, 184, 0.14);
      background: transparent;
      color: var(--text);
      border-radius: 10px;
      height: 42px;
      padding: 0 16px;
      font-weight: 600;
    }
    .secondary-btn:hover { background: rgba(255,255,255,0.05); }

    .toolbar-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 0 18px;
      flex-wrap: wrap;
    }
    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ghost-btn {
      border: 1px solid rgba(122, 207, 184, 0.14);
      background: transparent;
      color: var(--muted);
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .ghost-btn:hover, .ghost-btn.active {
      color: var(--text);
      background: rgba(255,255,255,0.04);
    }
    .storage-warning {
      border: 1px solid rgba(255,164,137,.55);
      background: rgba(131,64,47,.14);
      border-radius: 10px;
      padding: 11px 14px;
      color: #ffccc0;
      font-size: 13px;
      margin: 0 0 18px;
      line-height: 1.5;
    }
    .storage-warning[hidden] { display: none; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: #082d2e;
      color: var(--text);
      border: 1px solid rgba(122, 207, 184, 0.14);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
    .hidden-file-input { display: none; }

    .header-actions { display: flex; align-items: center; gap: 7px; }
    .header-actions .ghost-btn { height: 38px; padding: 0 12px; }
    .content-header { margin-bottom: 20px; }
    .card .dropdown { top: 36px; }
    .card:has(.dropdown:not([hidden])) { z-index: 10; }

    /* Category board: each tag is a full-height column on the home page. */
    .content { display: flex; flex-direction: column; overflow: hidden; padding: 22px 20px 0; }
    .content-header { flex: 0 0 auto; }
    .cards {
      display: flex;
      align-items: stretch;
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      gap: 14px;
      padding: 0 1px 16px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
      scrollbar-color: rgba(125,206,187,.33) transparent;
      overscroll-behavior-x: contain;
    }
    .category-column {
      display: flex;
      flex-direction: column;
      flex: 0 0 clamp(260px, calc((100% - 42px) / 4), 360px);
      min-width: 0;
      min-height: 0;
      background: rgba(4, 44, 45, .75);
      border: 1px solid rgba(126, 210, 191, .16);
      border-radius: 13px;
      scroll-snap-align: start;
    }
    .category-column.drop-target { border-color: #80ddc5; background: rgba(15,96,88,.54); }
    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 11px;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
      border-radius: 13px 13px 0 0;
      user-select: none;
      cursor: grab;
    }
    .category-header:active { cursor: grabbing; }
    .category-heading { display:flex; align-items:center; gap:8px; min-width:0; }
    .category-name { font-size: 16px; font-weight: 750; color: var(--text); min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .category-number { min-width:22px; padding:3px 6px; text-align:center; border-radius:7px; background:rgba(111,186,170,.14); color:var(--muted); font-size:11px; font-weight:700; }
    .category-actions { display:flex; align-items:center; gap:2px; flex:0 0 auto; }
    .category-action {
      display: grid; place-items: center; flex:0 0 auto;
      border: 0; border-radius: 7px; background: transparent; color:var(--muted);
      width: 25px; height: 28px; padding: 0;
      font-size: 18px; line-height: 1;
    }
    .category-action:hover:not(:disabled), .category-action[aria-expanded="true"] { color:var(--text); background:rgba(255,255,255,.08); }
    .category-action:disabled { opacity:.23; cursor:default; }
    .category-menu-wrap { position:relative; }
    .category-menu { top:33px; }
    .category-items {
      display: flex;
      flex-direction: column;
      gap: 9px;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1 1 auto;
      min-height:0;
      padding: 11px;
      scrollbar-width: thin;
      scrollbar-color: rgba(125,206,187,.28) transparent;
    }
    .category-items .card { width:100%; flex:0 0 auto; }
    .category-items .site-title { white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
    .category-placeholder { padding:22px 10px; text-align:center; color:var(--muted-2); font-size:12px; line-height:1.5; }
    .board-placeholder {
      margin: auto; text-align:center; color:var(--muted); max-width:380px;
      line-height:1.6; padding:30px 20px;
    }
    .board-placeholder h2 { color:var(--text); margin: 0 0 6px; font-size:21px; }
    .add-category-btn { height: 36px; padding: 0 12px; font-size: 12px; white-space:nowrap; }
    .category-create-hint { font-size:12px; color:var(--muted-2); margin:8px 0 0; }
    #categoryDialog .field { margin-bottom: 4px; }
    #categoryDialog .modal-actions { margin-top: 19px; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid #87dbc4; outline-offset: 2px;
    }
    @media (min-width: 1101px) {
      .cards[data-column-count="3"] .category-column { flex-basis: min(520px, calc((100% - 28px) / 3)); }
    }
    @media (max-width: 1100px) {
      .category-column { flex-basis: clamp(256px, calc((100% - 28px) / 3), 335px); }
    }
    @media (max-width: 860px) {
      /* The mobile navigation floats over the dashboard; the dashboard still fills the screen. */
      body { overflow: hidden; }
      .app, .app.sidebar-open {
        width: 100%;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        margin: 0;
        display: block;
        border: 0;
        border-radius: 0;
      }
      .main { height: 100%; min-height: 0; }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100dvh;
        width: min(290px, calc(100vw - 40px));
        z-index: 60;
        transform: translateX(-101%);
        transition: transform .2s ease, visibility .2s, opacity .2s;
        box-shadow: 18px 0 45px rgba(0,0,0,.3);
      }
      .sidebar-open .sidebar { transform: translateX(0); opacity: 1; visibility: visible; pointer-events: auto; }
      .sidebar-backdrop {
        display: block;
        position: fixed;
        z-index: 50;
        inset: 0;
        background: rgba(0,0,0,.58);
        border: 0;
      }
      .sidebar-backdrop[hidden] { display: none; }
      .content { padding: 18px 16px 0; }
      .category-column { flex-basis: min(345px, 80vw); }
      .topbar { padding: 12px 18px; }
      .search-wrap { max-width: none; }
    }
    @media (max-width: 540px) {
      .topbar { gap: 8px; padding: 10px 12px; }
      .menu-toggle, .search-input, .add-btn { height: 40px; }
      .menu-toggle { width: 40px; }
      .topbar-right { flex: 0 0 auto; }
      .add-btn { padding: 0 12px; font-size: 13px; }
      .topbar-right .add-btn .icon, .topbar-right .add-btn span { display: none; }
      .topbar-right .add-btn::after { content: 'Add'; }
      .search-wrap { flex: 1 1 0; min-width: 0; }
      .search-input { padding: 0 8px 0 34px; font-size: 13px; }
      .search-wrap .icon { left: 10px; }
      .content { padding: 18px 12px 0; }
      .category-column { flex-basis: min(315px, calc(100vw - 37px)); }
      .category-header { padding: 12px 8px; }
      .category-name { font-size: 15px; }
      .page-title { font-size: 18px; }
      .content-header { gap: 12px; align-items: flex-start; flex-wrap: wrap; }
      .header-actions { margin-left: auto; }
      .sort-btn { padding: 0 9px; font-size: 12px; }
      .cards { grid-template-columns: 1fr; gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .app, .sidebar { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <button type="button" id="sidebarBackdrop" class="sidebar-backdrop" hidden aria-label="Close menu"></button>
    <aside class="sidebar" id="sidebar" aria-label="Bookmark navigation" aria-hidden="true">
      <div class="brand">
        <div class="brand-name">
        <div class="brand-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4h10a2 2 0 0 1 2 2v14l-7-4-7 4V6a2 2 0 0 1 2-2z"></path>
          </svg>
        </div>
        <span>Bookmark Manager</span>
        </div>
        <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Hide menu" title="Hide menu">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="nav">
        <button class="nav-btn active" type="button" data-view="home">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path></svg>
          <span>Home</span>
        </button>
        <button class="nav-btn" type="button" data-view="archived">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18"></path><path d="M5 7l1 13h12l1-13"></path><path d="M10 11h4"></path></svg>
          <span>Archived</span>
        </button>
      </div>

      <div class="sidebar-section-label">Categories</div>
      <div class="tags-list" id="tagsList"></div>
      <div class="sidebar-bottom">
        <button class="ghost-btn" id="exportBtn" type="button" title="Export a bookmark backup">Export</button>
        <button class="ghost-btn" id="importBtn" type="button" title="Import a bookmark backup">Import</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <button type="button" class="menu-toggle" id="menuToggle" aria-label="Show bookmark menu" aria-expanded="false" aria-controls="sidebar" title="Show menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="search-wrap">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="searchInput" class="search-input" type="search" placeholder="Search by title..." autocomplete="off">
        </div>
        <div class="topbar-right">
          <button class="add-btn" id="openAddBtn" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
            <span>Add Bookmark</span>
          </button>
        </div>
      </div>

      <section class="content">
        <div class="content-header">
          <h1 class="page-title" id="pageTitle">All bookmarks</h1>
          <div class="header-actions">
            <button class="ghost-btn add-category-btn" id="newCategoryBtn" type="button" title="Create a category">+ Category</button>
            <button class="ghost-btn active" id="allFilterBtn" type="button">All</button>
            <button class="ghost-btn" id="favoritesFilterBtn" type="button">Pinned</button>
            <button class="sort-btn" id="sortButton" type="button" title="Change sort order">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10M11 12h7M11 19h4M4 4v16m0 0-3-3m3 3 3-3"></path></svg>
              <span id="sortLabel">Newest</span>
            </button>
          </div>
        </div>

        <div id="storageWarning" class="storage-warning" role="alert" hidden>Saving is blocked in this browser. Links may disappear when you reload. Use Export in the menu to back them up.</div>
        <div id="cards" class="cards"></div>
      </section>
    </main>
  </div>

  <dialog id="bookmarkDialog">
    <form class="modal" id="bookmarkForm" method="dialog">
      <div class="modal-top">
        <div>
          <h2 class="modal-title" id="dialogTitle">Add bookmark</h2>
        </div>
        <button class="close-btn" type="button" id="closeDialogBtn" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </div>

      <div class="field">
        <label for="titleInput">Title</label>
        <input id="titleInput" name="title" type="text" maxlength="80" required>
        <div class="error" id="titleError"></div>
      </div>

      <div class="field">
        <label for="urlInput">URL</label>
        <input id="urlInput" name="url" type="text" inputmode="url" placeholder="https://example.com" required>
        <div class="error" id="urlError"></div>
      </div>

      <div class="field">
        <label for="tagsInput">Categories / tags</label>
        <input id="tagsInput" name="tags" type="text" placeholder="Cars, Cooking, Random" autocomplete="off">
        <p class="category-create-hint">Separate categories with commas. Each tag adds this site to its category.</p>
      </div>

      <div class="modal-actions">
        <button class="secondary-btn" type="button" id="cancelDialogBtn">Cancel</button>
        <button class="add-btn" type="submit" id="saveBookmarkBtn">Save bookmark</button>
      </div>
    </form>
  </dialog>

  <dialog id="categoryDialog">
    <form class="modal" id="categoryForm">
      <div class="modal-top">
        <div><h2 class="modal-title" id="categoryDialogTitle">New category</h2></div>
        <button class="close-btn" type="button" id="closeCategoryDialogBtn" aria-label="Close">×</button>
      </div>
      <div class="field">
        <label for="categoryNameInput">Category name</label>
        <input type="text" id="categoryNameInput" maxlength="40" placeholder="Cars" required autocomplete="off">
        <div class="error" id="categoryNameError"></div>
      </div>
      <div class="modal-actions">
        <button class="secondary-btn" type="button" id="cancelCategoryBtn">Cancel</button>
        <button class="add-btn" type="submit" id="saveCategoryBtn">Save category</button>
      </div>
    </form>
  </dialog>

  <input class="hidden-file-input" id="importFileInput" type="file" accept="application/json">
  <div class="toast" id="toast"></div>

  <script>
    (() => {
      const STORAGE_KEY = 'quickspace.bookmarks.v2';
      const SORT_KEY = 'quickspace.sort.v2';
      const VIEW_KEY = 'quickspace.view.v2';
      const PINNED_FILTER_KEY = 'quickspace.pinned_filter.v2';
      const CATEGORIES_KEY = 'quickspace.categories.v1';

      function createId() {
        if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
        return `bm-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 11)}`;
      }

      // Start new installations empty. Existing saved bookmarks are never replaced.
      const seedBookmarks = [];

      const els = {
        app: document.getElementById('app'),
        storageWarning: document.getElementById('storageWarning'),
        sidebar: document.getElementById('sidebar'),
        sidebarBackdrop: document.getElementById('sidebarBackdrop'),
        menuToggle: document.getElementById('menuToggle'),
        sidebarClose: document.getElementById('sidebarClose'),
        cards: document.getElementById('cards'),
        newCategoryBtn: document.getElementById('newCategoryBtn'),
        categoryDialog: document.getElementById('categoryDialog'),
        categoryForm: document.getElementById('categoryForm'),
        categoryDialogTitle: document.getElementById('categoryDialogTitle'),
        categoryNameInput: document.getElementById('categoryNameInput'),
        categoryNameError: document.getElementById('categoryNameError'),
        closeCategoryDialogBtn: document.getElementById('closeCategoryDialogBtn'),
        cancelCategoryBtn: document.getElementById('cancelCategoryBtn'),
        saveCategoryBtn: document.getElementById('saveCategoryBtn'),
        tagsList: document.getElementById('tagsList'),
        pageTitle: document.getElementById('pageTitle'),
        searchInput: document.getElementById('searchInput'),
        bookmarkDialog: document.getElementById('bookmarkDialog'),
        bookmarkForm: document.getElementById('bookmarkForm'),
        dialogTitle: document.getElementById('dialogTitle'),
        titleInput: document.getElementById('titleInput'),
        urlInput: document.getElementById('urlInput'),
        tagsInput: document.getElementById('tagsInput'),
        titleError: document.getElementById('titleError'),
        urlError: document.getElementById('urlError'),
        openAddBtn: document.getElementById('openAddBtn'),
        closeDialogBtn: document.getElementById('closeDialogBtn'),
        cancelDialogBtn: document.getElementById('cancelDialogBtn'),
        sortButton: document.getElementById('sortButton'),
        sortLabel: document.getElementById('sortLabel'),
        toast: document.getElementById('toast'),
        importFileInput: document.getElementById('importFileInput'),
        exportBtn: document.getElementById('exportBtn'),
        importBtn: document.getElementById('importBtn'),
        allFilterBtn: document.getElementById('allFilterBtn'),
        favoritesFilterBtn: document.getElementById('favoritesFilterBtn'),
        navButtons: Array.from(document.querySelectorAll('.nav-btn'))
      };

      let bookmarks = loadBookmarks();
      let categories = loadCategories();
      let renamingCategory = null;
      syncCategoriesFromBookmarks();
      let currentView = readSetting(VIEW_KEY, 'home');
      let currentSort = readSetting(SORT_KEY, 'recent');
      let selectedTag = 'all';
      let onlyPinned = readSetting(PINNED_FILTER_KEY, 'false') === 'true';
      let editingId = null;
      let toastTimer = null;

      bindEvents();
      setSidebarOpen(false);
      render();

      function bindEvents() {
        els.menuToggle.addEventListener('click', () => setSidebarOpen(!els.app.classList.contains('sidebar-open')));
        els.sidebarClose.addEventListener('click', () => setSidebarOpen(false));
        els.sidebarBackdrop.addEventListener('click', () => setSidebarOpen(false));
        els.openAddBtn.addEventListener('click', () => openDialog());
        els.newCategoryBtn.addEventListener('click', () => openCategoryDialog());
        els.closeCategoryDialogBtn.addEventListener('click', closeCategoryDialog);
        els.cancelCategoryBtn.addEventListener('click', closeCategoryDialog);
        els.categoryForm.addEventListener('submit', event => {
          event.preventDefault();
          saveCategoryFromForm();
        });
        els.closeDialogBtn.addEventListener('click', closeDialog);
        els.cancelDialogBtn.addEventListener('click', closeDialog);
        els.searchInput.addEventListener('input', render);

        els.sortButton.addEventListener('click', () => {
          const order = ['recent', 'title', 'visits'];
          currentSort = order[(order.indexOf(currentSort) + 1) % order.length];
          writeSetting(SORT_KEY, currentSort);
          render();
          showToast(`Sort: ${sortLabelFor(currentSort)}`);
        });

        els.bookmarkForm.addEventListener('submit', event => {
          event.preventDefault();
          saveBookmarkFromForm();
        });

        els.exportBtn.addEventListener('click', exportBookmarks);
        els.importBtn.addEventListener('click', () => els.importFileInput.click());
        els.importFileInput.addEventListener('change', importBookmarks);

        els.allFilterBtn.addEventListener('click', () => {
          onlyPinned = false;
          writeSetting(PINNED_FILTER_KEY, 'false');
          render();
        });
        els.favoritesFilterBtn.addEventListener('click', () => {
          onlyPinned = true;
          writeSetting(PINNED_FILTER_KEY, 'true');
          render();
        });

        els.navButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            currentView = btn.dataset.view;
            selectedTag = 'all';
            writeSetting(VIEW_KEY, currentView);
            render();
            if (window.matchMedia('(max-width: 860px)').matches) setSidebarOpen(false);
          });
        });

        document.addEventListener('click', event => {
          if (!event.target.closest('.card-menu-wrap, .category-menu-wrap')) {
            document.querySelectorAll('.dropdown').forEach(menu => menu.hidden = true);
          }
        });

        window.addEventListener('keydown', event => {
          if (event.key === 'Escape' && els.app.classList.contains('sidebar-open')) setSidebarOpen(false);
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
            event.preventDefault();
            els.searchInput.focus();
          }
        });
      }

      function setSidebarOpen(open) {
        els.app.classList.toggle('sidebar-open', open);
        els.menuToggle.setAttribute('aria-expanded', String(open));
        els.menuToggle.setAttribute('aria-label', open ? 'Hide bookmark menu' : 'Show bookmark menu');
        els.menuToggle.title = open ? 'Hide menu' : 'Show menu';
        els.sidebar.setAttribute('aria-hidden', String(!open));
        els.sidebarBackdrop.hidden = !open;
        if ('inert' in els.sidebar) els.sidebar.inert = !open;
        if (!open && els.sidebar.contains(document.activeElement)) els.menuToggle.focus();
      }

      function showStorageWarning() {
        els.storageWarning.hidden = false;
      }

      function readSetting(key, fallback) {
        try { return localStorage.getItem(key) ?? fallback; }
        catch { showStorageWarning(); return fallback; }
      }

      function writeSetting(key, value) {
        try { localStorage.setItem(key, value); return true; }
        catch { showStorageWarning(); return false; }
      }

      function normalizeUrl(value) {
        let url = String(value ?? '').trim();
        if (!url) throw new Error('URL is required');
        if (!/^https?:\/\//i.test(url)) {
          if (/^[a-z][a-z0-9+.-]*:/i.test(url)) throw new Error('Only http and https links are supported');
          url = `https://${url}`;
        }
        const parsed = new URL(url);
        if (!['http:', 'https:'].includes(parsed.protocol) || !parsed.hostname) throw new Error('Invalid website URL');
        return parsed.href;
      }

      function loadBookmarks() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            writeSetting(STORAGE_KEY, JSON.stringify(seedBookmarks));
            return seedBookmarks;
          }
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : seedBookmarks;
        } catch (error) {
          console.error(error);
          showStorageWarning();
          return [...seedBookmarks];
        }
      }

      function persist() {
        return writeSetting(STORAGE_KEY, JSON.stringify(bookmarks));
      }

      function normalizedTags(tags) {
        if (!Array.isArray(tags)) return [];
        const seen = new Set();
        return tags.map(tag => String(tag).trim().slice(0, 40)).filter(tag => {
          const key = tag.toLocaleLowerCase();
          if (!tag || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function categoryKey(name) { return String(name).trim().toLocaleLowerCase(); }

      function loadCategories() {
        const raw = readSetting(CATEGORIES_KEY, null);
        if (!raw) return [];
        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          const seen = new Set();
          return parsed.filter(name => {
            if (typeof name !== 'string' || !name.trim() || seen.has(categoryKey(name))) return false;
            seen.add(categoryKey(name));
            return true;
          }).map(name => name.trim().slice(0,40));
        } catch { return []; }
      }

      function persistCategories() {
        return writeSetting(CATEGORIES_KEY, JSON.stringify(categories));
      }

      function syncCategoriesFromBookmarks() {
        const seen = new Set(categories.map(categoryKey));
        for (const bookmark of bookmarks) {
          const names = normalizedTags(bookmark.tags);
          if (!names.length && !seen.has('uncategorized')) {
            categories.push('Uncategorized');
            seen.add('uncategorized');
          }
          for (const tag of names) {
            if (!seen.has(categoryKey(tag))) {
              categories.push(tag);
              seen.add(categoryKey(tag));
            }
          }
        }
        persistCategories();
      }

      function categoryLabel(name) {
        return categories.find(item => categoryKey(item) === categoryKey(name)) || name;
      }

      function bookmarkCategories(bookmark) {
        const names = normalizedTags(bookmark.tags);
        return names.length ? names.map(categoryLabel) : ['Uncategorized'];
      }

      function openCategoryDialog(name = null) {
        renamingCategory = name;
        els.categoryDialogTitle.textContent = name ? 'Rename category' : 'New category';
        els.saveCategoryBtn.textContent = name ? 'Save name' : 'Create category';
        els.categoryNameInput.value = name || '';
        els.categoryNameError.textContent = '';
        els.categoryDialog.showModal();
        els.categoryNameInput.focus();
        if (name) els.categoryNameInput.select();
      }

      function closeCategoryDialog() {
        els.categoryDialog.close();
        renamingCategory = null;
        els.categoryNameError.textContent = '';
      }

      function saveCategoryFromForm() {
        const newName = els.categoryNameInput.value.trim();
        const oldName = renamingCategory;
        if (!newName) {
          els.categoryNameError.textContent = 'Enter a name.';
          return;
        }
        if (oldName && categoryKey(oldName) === 'uncategorized') {
          els.categoryNameError.textContent = 'The untagged category cannot be renamed.';
          return;
        }
        if (categories.some(name => categoryKey(name) === categoryKey(newName) && (!oldName || categoryKey(name) !== categoryKey(oldName)))) {
          els.categoryNameError.textContent = 'That category already exists.';
          return;
        }
        if (oldName) {
          const idx = categories.findIndex(name => categoryKey(name) === categoryKey(oldName));
          if (idx === -1) return;
          categories[idx] = newName;
          bookmarks = bookmarks.map(bookmark => ({
            ...bookmark,
            tags: normalizedTags(bookmark.tags).map(tag => categoryKey(tag) === categoryKey(oldName) ? newName : tag)
          }));
          if (categoryKey(selectedTag) === categoryKey(oldName)) selectedTag = newName;
          persist();
        } else {
          categories.push(newName);
          selectedTag = 'all';
          onlyPinned = false;
          writeSetting(PINNED_FILTER_KEY, 'false');
          els.searchInput.value = '';
        }
        persistCategories();
        closeCategoryDialog();
        render();
        showToast(oldName ? 'Category renamed' : 'Category created');
      }

      function moveCategory(name, delta) {
        const from = categories.findIndex(item => categoryKey(item) === categoryKey(name));
        const to = from + delta;
        if (from < 0 || to < 0 || to >= categories.length) return;
        [categories[from], categories[to]] = [categories[to], categories[from]];
        persistCategories();
        render();
      }

      function moveCategoryToFirst(name) {
        const from = categories.findIndex(item => categoryKey(item) === categoryKey(name));
        if (from <= 0) return;
        const [category] = categories.splice(from, 1);
        categories.unshift(category);
        persistCategories();
        render();
        showToast(`${category} moved to first`);
      }

      function reorderCategory(source, target) {
        if (categoryKey(source) === categoryKey(target)) return;
        const from = categories.findIndex(item => categoryKey(item) === categoryKey(source));
        const to = categories.findIndex(item => categoryKey(item) === categoryKey(target));
        if (from < 0 || to < 0) return;
        const [name] = categories.splice(from,1);
        categories.splice(to,0,name);
        persistCategories();
        render();
      }

      function deleteCategory(name) {
        if (categoryKey(name) === 'uncategorized') {
          showToast('Uncategorized is used for bookmarks without a tag');
          return;
        }
        if (!window.confirm(`Remove the “${name}” category? The bookmarks will stay saved, but this tag will be removed from them.`)) return;
        bookmarks = bookmarks.map(bookmark => ({
          ...bookmark,
          tags: normalizedTags(bookmark.tags).filter(tag => categoryKey(tag) !== categoryKey(name))
        }));
        categories = categories.filter(item => categoryKey(item) !== categoryKey(name));
        if (categoryKey(selectedTag) === categoryKey(name)) selectedTag = 'all';
        persist();
        syncCategoriesFromBookmarks();
        render();
        showToast('Category removed; bookmarks kept');
      }

      function render() {
        renderNav();
        renderTagList();
        renderCards();
        els.sortLabel.textContent = sortLabelFor(currentSort);
        els.allFilterBtn.classList.toggle('active', !onlyPinned);
        els.favoritesFilterBtn.classList.toggle('active', onlyPinned);
      }

      function renderNav() {
        els.navButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.view === currentView));
        els.pageTitle.textContent = currentView === 'archived' ? 'Archived bookmarks' : 'All bookmarks';
      }

      function getFilteredBookmarks() {
        const query = els.searchInput.value.trim().toLowerCase();
        const filtered = bookmarks.filter(bookmark => {
          if (currentView === 'home' && bookmark.archived) return false;
          if (currentView === 'archived' && !bookmark.archived) return false;
          if (onlyPinned && !bookmark.pinned) return false;
          if (!query) return true;
          const haystack = [bookmark.title, bookmark.url, normalizedTags(bookmark.tags).join(' ')].join(' ').toLowerCase();
          return haystack.includes(query);
        });

        return filtered.sort((a, b) => {
          if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
          if (currentSort === 'title') return a.title.localeCompare(b.title);
          if (currentSort === 'visits') return (b.visits || 0) - (a.visits || 0);
          return (b.createdAt || 0) - (a.createdAt || 0);
        });
      }

      function visibleBookmarksForTags() {
        return bookmarks.filter(bookmark => currentView === 'archived' ? bookmark.archived : !bookmark.archived);
      }

      function renderTagList() {
        els.tagsList.innerHTML = '';
        const allRow = document.createElement('button');
        allRow.type = 'button';
        allRow.className = 'tag-row' + (selectedTag === 'all' ? ' active' : '');
        allRow.innerHTML = `<span class="tag-left"><span class="tag-check" aria-hidden="true"></span><span class="tag-name">All categories</span></span>`;
        allRow.addEventListener('click', () => {
          selectedTag = 'all';
          render();
          if (matchMedia('(max-width: 860px)').matches) setSidebarOpen(false);
        });
        els.tagsList.appendChild(allRow);

        const available = visibleBookmarksForTags();
        categories.forEach(name => {
          const count = available.filter(bookmark => bookmarkCategories(bookmark).some(tag => categoryKey(tag) === categoryKey(name))).length;
          const row = document.createElement('button');
          row.type = 'button';
          row.className = 'tag-row' + (categoryKey(selectedTag) === categoryKey(name) ? ' active' : '');
          row.innerHTML = `
            <span class="tag-left">
              <span class="tag-check" aria-hidden="true"></span>
              <span class="tag-name">${escapeHtml(name)}</span>
            </span>
            <span class="tag-count">${count}</span>`;
          row.addEventListener('click', () => {
            selectedTag = name;
            render();
            if (matchMedia('(max-width: 860px)').matches) setSidebarOpen(false);
          });
          els.tagsList.appendChild(row);
        });
      }

      function renderCards() {
        els.cards.innerHTML = '';
        const items = getFilteredBookmarks();
        const activeTags = selectedTag === 'all'
          ? categories.slice()
          : categories.filter(name => categoryKey(name) === categoryKey(selectedTag));
        const searching = Boolean(els.searchInput.value.trim() || onlyPinned);
        const columns = activeTags.map(name => ({
          name,
          items: items.filter(bookmark => bookmarkCategories(bookmark).some(tag => categoryKey(tag) === categoryKey(name)))
        })).filter(col => !searching || col.items.length);
        els.cards.dataset.columnCount = String(columns.length);

        if (!columns.length) {
          const empty = document.createElement('div');
          empty.className = 'board-placeholder';
          empty.innerHTML = categories.length
            ? '<h2>No bookmarks found</h2><p>Try another search or category.</p>'
            : '<h2>Organize your bookmarks</h2><p>Create a category, or add a bookmark with a tag to make its category automatically.</p>';
          const add = document.createElement('button');
          add.className = 'add-btn';
          add.type = 'button';
          add.textContent = categories.length ? 'Add Bookmark' : '+ New Category';
          add.addEventListener('click', () => categories.length ? openDialog() : openCategoryDialog());
          empty.appendChild(add);
          els.cards.appendChild(empty);
          return;
        }

        columns.forEach(({ name, items: columnItems }) => {
          const globalIndex = categories.findIndex(tag => categoryKey(tag) === categoryKey(name));
          const column = document.createElement('section');
          column.className = 'category-column';
          column.dataset.category = name;
          column.setAttribute('aria-label', `${name} bookmarks`);
          column.innerHTML = `
            <div class="category-header" draggable="true" title="Drag to reorder categories">
              <div class="category-heading">
                <span class="category-name" title="${escapeAttribute(name)}">${escapeHtml(name)}</span>
                <span class="category-number">${columnItems.length}</span>
              </div>
              <div class="category-actions">
                <button type="button" class="category-action" data-action="left" title="Move ${escapeAttribute(name)} left" aria-label="Move ${escapeAttribute(name)} left" ${globalIndex === 0 ? 'disabled' : ''}>‹</button>
                <button type="button" class="category-action" data-action="right" title="Move ${escapeAttribute(name)} right" aria-label="Move ${escapeAttribute(name)} right" ${globalIndex === categories.length - 1 ? 'disabled' : ''}>›</button>
                <button type="button" class="category-action" data-action="add" title="Add bookmark to ${escapeAttribute(name)}" aria-label="Add bookmark to ${escapeAttribute(name)}">+</button>
                <span class="category-menu-wrap">
                  <button type="button" class="category-action" data-action="more" title="Category options" aria-label="Options for ${escapeAttribute(name)}" aria-expanded="false">⋯</button>
                  <span class="dropdown category-menu" hidden>
                    <button type="button" data-action="first">Move to first</button>
                    <button type="button" data-action="rename">Rename</button>
                    <button type="button" data-action="delete" class="danger">Remove category</button>
                  </span>
                </span>
              </div>
            </div>
            <div class="category-items"></div>
          `;
          const list = column.querySelector('.category-items');
          if (columnItems.length) {
            columnItems.forEach(bookmark => list.appendChild(createBookmarkCard(bookmark)));
          } else {
            const placeholder = document.createElement('div');
            placeholder.className = 'category-placeholder';
            placeholder.textContent = 'No bookmarks in this category yet';
            list.appendChild(placeholder);
          }
          const header = column.querySelector('.category-header');
          header.addEventListener('dragstart', event => {
            if (event.target.closest('button')) { event.preventDefault(); return; }
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', name);
          });
          column.addEventListener('dragover', event => {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            column.classList.add('drop-target');
          });
          column.addEventListener('dragleave', event => {
            if (!column.contains(event.relatedTarget)) column.classList.remove('drop-target');
          });
          column.addEventListener('drop', event => {
            event.preventDefault();
            column.classList.remove('drop-target');
            reorderCategory(event.dataTransfer.getData('text/plain'), name);
          });
          column.addEventListener('dragend', () => document.querySelectorAll('.drop-target').forEach(col => col.classList.remove('drop-target')));
          const more = column.querySelector('[data-action="more"]');
          const menu = column.querySelector('.category-menu');
          header.querySelector('[data-action="left"]').addEventListener('click', () => moveCategory(name, -1));
          header.querySelector('[data-action="right"]').addEventListener('click', () => moveCategory(name, 1));
          header.querySelector('[data-action="add"]').addEventListener('click', () => openDialog(null, name));
          more.addEventListener('click', event => {
            event.stopPropagation();
            document.querySelectorAll('.dropdown').forEach(item => { if (item !== menu) item.hidden = true; });
            menu.hidden = !menu.hidden;
            more.setAttribute('aria-expanded', String(!menu.hidden));
          });
          menu.querySelector('[data-action="first"]').addEventListener('click', () => moveCategoryToFirst(name));
          menu.querySelector('[data-action="rename"]').addEventListener('click', () => openCategoryDialog(name));
          menu.querySelector('[data-action="delete"]').addEventListener('click', () => deleteCategory(name));
          els.cards.appendChild(column);
        });
      }

      function createBookmarkCard(bookmark) {
          const card = document.createElement('article');
          card.className = 'card';
          const host = safeHost(bookmark.url);
          card.innerHTML = `
            <a class="card-link" href="${escapeAttribute(bookmark.url)}" target="_blank" rel="noopener noreferrer" title="Open ${escapeAttribute(bookmark.title)}">
              <div class="site-icon-wrap">${faviconMarkup(bookmark)}</div>
              <div class="site-meta">
                <div class="site-title" title="${escapeAttribute(bookmark.title)}">${escapeHtml(bookmark.title)}</div>
                <div class="site-url" title="${escapeAttribute(host)}">${escapeHtml(host)}</div>
              </div>
            </a>
            <div class="card-controls">
              <button class="pin-btn ${bookmark.pinned ? 'pinned' : ''}" type="button" title="${bookmark.pinned ? 'Unpin' : 'Pin'} bookmark" aria-label="${bookmark.pinned ? 'Unpin' : 'Pin'} ${escapeAttribute(bookmark.title)}">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M6 3h12m-10 0 1 7-3 4h12l-3-4 1-7"></path></svg>
              </button>
              <div class="card-menu-wrap">
                <button class="dots-btn" type="button" aria-label="More options for ${escapeAttribute(bookmark.title)}" aria-expanded="false">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </button>
                <div class="dropdown" hidden>
                  <button type="button" data-action="open">Open</button>
                  <button type="button" data-action="edit">Edit</button>
                  <button type="button" data-action="toggle-archive">${bookmark.archived ? 'Move to Home' : 'Archive'}</button>
                  <button type="button" data-action="delete" class="danger">Delete</button>
                </div>
              </div>
            </div>
          `;
          const img = card.querySelector('.site-icon-wrap img');
          if (img) {
            img.addEventListener('load', () => img.classList.add('loaded'));
            if (img.complete && img.naturalWidth > 0) img.classList.add('loaded');
            img.addEventListener('error', () => {
              if (!img.dataset.retried) {
                img.dataset.retried = '1';
                img.src = new URL('/favicon.ico', bookmark.url).href;
              } else {
                img.remove();
              }
            });
          }

          card.querySelector('.card-link').addEventListener('click', () => incrementVisits(bookmark.id));

          card.querySelector('.pin-btn').addEventListener('click', () => togglePinned(bookmark.id));

          const dotsBtn = card.querySelector('.dots-btn');
          const dropdown = card.querySelector('.dropdown');
          dotsBtn.addEventListener('click', event => {
            event.stopPropagation();
            document.querySelectorAll('.dropdown').forEach(menu => { if (menu !== dropdown) menu.hidden = true; });
            dropdown.hidden = !dropdown.hidden;
            dotsBtn.setAttribute('aria-expanded', String(!dropdown.hidden));
          });

          dropdown.addEventListener('click', event => {
            const action = event.target.closest('button')?.dataset.action;
            if (!action) return;
            dropdown.hidden = true;
            dotsBtn.setAttribute('aria-expanded', 'false');
            if (action === 'open') {
              incrementVisits(bookmark.id);
              window.open(bookmark.url, '_blank', 'noopener');
            } else if (action === 'edit') {
              openDialog(bookmark);
            } else if (action === 'toggle-archive') {
              toggleArchived(bookmark.id);
            } else if (action === 'delete') {
              deleteBookmark(bookmark.id);
            }
          });

          return card;
      }

      function openDialog(bookmark = null, category = null) {
        editingId = bookmark?.id || null;
        els.dialogTitle.textContent = editingId ? 'Edit bookmark' : 'Add bookmark';
        els.titleInput.value = bookmark?.title || '';
        els.urlInput.value = bookmark?.url || '';
        els.tagsInput.value = bookmark?.tags?.join(', ') || category || (selectedTag !== 'all' ? selectedTag : '');
        clearErrors();
        els.bookmarkDialog.showModal();
        setTimeout(() => els.titleInput.focus(), 50);
      }

      function closeDialog() {
        els.bookmarkDialog.close();
        editingId = null;
        els.bookmarkForm.reset();
        clearErrors();
      }

      function clearErrors() {
        els.titleError.textContent = '';
        els.urlError.textContent = '';
      }

      function saveBookmarkFromForm() {
        clearErrors();
        const title = els.titleInput.value.trim();
        const rawUrl = els.urlInput.value.trim();
        const tags = normalizedTags(els.tagsInput.value.split(',')).map(categoryLabel);

        let valid = true;
        if (!title) {
          els.titleError.textContent = 'Please enter a title.';
          valid = false;
        }

        let url = '';
        try {
          url = normalizeUrl(rawUrl);
        } catch {
          els.urlError.textContent = 'Please enter a valid http or https website address.';
          valid = false;
        }

        if (!valid) return;

        if (editingId) {
          bookmarks = bookmarks.map(item => item.id === editingId ? { ...item, title, url, tags } : item);
        } else {
          bookmarks.unshift({
            id: createId(),
            title,
            url,
            description: '',
            tags,
            archived: false,
            pinned: false,
            createdAt: Date.now(),
            visits: 0
          });
        }

        const wasEditing = Boolean(editingId);
        if (!wasEditing) {
          selectedTag = 'all';
          onlyPinned = false;
          writeSetting(PINNED_FILTER_KEY, 'false');
          els.searchInput.value = '';
        }
        const saved = persist();
        syncCategoriesFromBookmarks();
        closeDialog();
        render();
        if (saved) showToast(wasEditing ? 'Bookmark updated' : 'Bookmark added');
      }

      function togglePinned(id) {
        bookmarks = bookmarks.map(item => item.id === id ? { ...item, pinned: !item.pinned } : item);
        persist();
        render();
      }

      function toggleArchived(id) {
        bookmarks = bookmarks.map(item => item.id === id ? { ...item, archived: !item.archived } : item);
        persist();
        render();
        showToast('Bookmark moved');
      }

      function deleteBookmark(id) {
        const confirmed = window.confirm('Delete this bookmark?');
        if (!confirmed) return;
        bookmarks = bookmarks.filter(item => item.id !== id);
        persist();
        render();
        showToast('Bookmark deleted');
      }

      function incrementVisits(id) {
        bookmarks = bookmarks.map(item => item.id === id ? { ...item, visits: (item.visits || 0) + 1 } : item);
        persist();
      }

      function exportBookmarks() {
        const payload = {
          exportedAt: new Date().toISOString(),
          categories,
          bookmarks
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'quickspace-bookmarks.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Backup exported');
      }

      function importBookmarks(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            const imported = Array.isArray(parsed) ? parsed : parsed.bookmarks;
            if (!Array.isArray(imported)) throw new Error('Invalid file');
            bookmarks = imported.map(item => ({
              id: item.id || createId(),
              title: item.title || 'Untitled',
              url: normalizeUrl(item.url),
              description: item.description || '',
              tags: Array.isArray(item.tags) ? item.tags : [],
              archived: Boolean(item.archived),
              pinned: Boolean(item.pinned),
              createdAt: item.createdAt || Date.now(),
              visits: Number(item.visits || 0)
            }));
            if (Array.isArray(parsed.categories)) {
              const seen = new Set();
              categories = parsed.categories.filter(name => {
                if (typeof name !== 'string' || !name.trim() || seen.has(categoryKey(name))) return false;
                seen.add(categoryKey(name));
                return true;
              }).map(name => name.trim().slice(0, 40));
            }
            persist();
            syncCategoriesFromBookmarks();
            selectedTag = 'all';
            render();
            showToast('Backup imported');
          } catch (error) {
            alert('That file could not be imported.');
          } finally {
            event.target.value = '';
          }
        };
        reader.readAsText(file);
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add('show');
        toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2200);
      }

      function sortLabelFor(value) {
        if (value === 'title') return 'Title';
        if (value === 'visits') return 'Most opened';
        return 'Newest';
      }

      function safeHost(url) {
        try {
          const parsed = new URL(url);
          return parsed.hostname.replace(/^www\./, '');
        } catch {
          return url;
        }
      }

      function faviconMarkup(bookmark) {
        const host = safeHost(bookmark.url);
        const fallback = escapeHtml((bookmark.title || '?').trim().charAt(0).toUpperCase() || '?');
        const src = `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(host)}`;
        return `<span class="site-icon-fallback" aria-hidden="true">${fallback}</span><img src="${src}" alt="" loading="lazy">`;
      }

      function formatDate(timestamp) {
        if (!timestamp) return 'Never';
        const date = new Date(timestamp);
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replace(/`/g, '&#96;');
      }
    })();
  </script>
</body>
</html>
